name: Build OpenWrt userspace (armv7)

on:
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: "OpenWrt source tag"
        required: false
        default: "v25.12.6"
      target:
        description: "OpenWrt TARGET_SUBTARGET (closest arch match)"
        required: false
        default: "mvebu/cortexa9"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "config/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget xz-utils

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 --branch "${{ inputs.openwrt_tag || 'v25.12.6' }}" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt

      - name: Configure feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply userspace config
        working-directory: openwrt
        run: |
          cp ../config/userspace.config .config
          make defconfig
          grep -E "^CONFIG_TARGET_" .config | head -20

      - name: Download sources
        working-directory: openwrt
        run: make download -j$(nproc) || make download -j1 V=s

      - name: Build
        working-directory: openwrt
        run: |
          make -j$(nproc) IGNORE_ERRORS=n m -i || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p out
          TGTDIR=$(echo "${{ inputs.target || 'mvebu/cortexa9' }}" | tr '/' '_')
          SRC=openwrt/bin/targets/${TGTDIR}
          find openwrt/bin -name "*rootfs.tar.gz" -exec cp {} out/ \;
          find openwrt/bin -name "*.manifest" -exec cp {} out/ \; || true
          tar czf out/staging-rootfs.tar.gz -C openwrt/staging_dir $(ls openwrt/staging_dir | grep -v host) || true
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-userspace-${{ github.run_number }}
          path: out/

      - name: Publish release (direct-download artifacts)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "userspace-${{ github.run_number }}" out/* \
            --title "OpenWrt userspace build ${{ github.run_number }}" \
            --notes "Auto-built from config/userspace.config (OpenWrt v25.12.6, mvebu/cortexa9)"
