name: Patch rootfs and rebuild JFFS2 (soft-float)

# Fast path: takes the published soft-float rootfs.tar.gz, injects the
# F673AV9a network bootstrap + root password, repacks and rebuilds JFFS2.
# Runs in a couple of minutes instead of a full OpenWrt rebuild.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Release tag that contains *rootfs.tar.gz"
        required: true
        default: "softfloat-1"
      root_password:
        description: "root password for SSH/LuCI"
        required: false
        default: "f673a2026"
      diag_init:
        description: "Set true to replace /init with boot diagnostic (NAND log + telnetd)"
        required: false
        default: "false"
      uart_init:
        description: "Set true to install a static ARM init that prints straight to PL011 UART"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mtd-utils python3 python3-pip openssl gcc-arm-linux-gnueabi

      - name: Download base rootfs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.source_tag }}" \
            -R "${GITHUB_REPOSITORY}" -p '*rootfs.tar.gz' -D .
          ls -lh *.tar.gz

      - name: Inject overlay + password
        run: |
          set -e
          TAR=$(ls *rootfs.tar.gz | head -1)
          rm -rf rf && mkdir rf
          tar xzf "$TAR" -C rf
          # overlay (network config bridging eth0..eth3, uci-defaults, ...)
          if [ -d rootfs-overlay ]; then
            cp -a rootfs-overlay/. rf/
            chmod 755 rf/init rf/sbin/init rf/etc/rc.local 2>/dev/null || true
            ls -l rf/init rf/sbin/init rf/etc/rc.local || true
          fi
          # root password from input
          HASH=$(openssl passwd -1 -salt f673a '${{ inputs.root_password }}')
          python3 - "$HASH" <<'PY'
          import sys
          h = sys.argv[1]
          p = 'rf/etc/shadow'
          line = 'root:%s:19000:0:99999:7:::\n' % h
          lines = open(p, encoding='utf-8').read().splitlines(True)
          out = [line if l.startswith('root:') else l for l in lines]
          if not any(l.startswith('root:') for l in out):
              out.insert(0, line)
          open(p, 'w', encoding='utf-8').writelines(out)
          print('shadow root line set')
          PY
          # make sure sshd allows password login
          python3 - <<'PY'
          import os
          p = 'rf/etc/config/dropbear'
          if not os.path.exists(p):
            open(p, 'w').write("config dropbear\n\toption PasswordAuth 'on'\n\toption RootPasswordAuth 'on'\n\toption Port '22'\n")
          else:
            s = open(p).read()
            if 'PasswordAuth' not in s:
              s += "\toption PasswordAuth 'on'\n\toption RootPasswordAuth 'on'\n"
            open(p, 'w').write(s)
          print('dropbear config ok')
          PY
          # pre-bake dropbear host keys (OpenSSH format, dropbear >=2020.79 reads
          # them) so the board NEVER needs runtime keygen (/dev/random may block
          # on this vendor kernel). Keys are only read at runtime, never written.
          sudo mkdir -p rf/etc/dropbear
          sudo ssh-keygen -t ed25519 -f rf/etc/dropbear/dropbear_ed25519_host_key -N '' -q
          sudo ssh-keygen -t rsa -b 2048 -f rf/etc/dropbear/dropbear_rsa_host_key -N '' -q
          sudo chmod 600 rf/etc/dropbear/dropbear_*_host_key
          ls -l rf/etc/dropbear/
          sudo chown -R root:root rf
          sudo mkdir -p rf/dev && sudo mknod -m 622 rf/dev/console c 5 1 || true

      - name: Install diagnostic init
        if: ${{ inputs.diag_init == 'true' }}
        run: |
          set -e
          if [ -f rf/init ]; then sudo cp -a rf/init rf/init.orig; else sudo cp -a rf/sbin/init rf/init.orig; fi
          sudo cp -a rf/sbin/init rf/sbin/init.orig
          sudo tee rf/init > /dev/null <<'SH'
          #!/bin/sh
          # F673A diagnostic init: vendor kernel has no serial console, so we
          # persist boot state to NAND and expose a shell over the LAN port.
          PATH=/sbin:/bin:/usr/sbin:/usr/bin
          export PATH
          mount -t proc proc /proc 2>/dev/null
          mount -t sysfs sysfs /sys 2>/dev/null
          mount -t devtmpfs devtmpfs /dev 2>/dev/null
          mkdir -p /tmp
          L=/tmp/diag.txt
          : > $L
          echo "== DIAG INIT RAN ==" >> $L
          cat /proc/version >> $L 2>&1
          echo "-- cmdline --" >> $L
          cat /proc/cmdline >> $L 2>&1
          echo "-- mtd --" >> $L
          cat /proc/mtd >> $L 2>&1
          echo "-- mounts --" >> $L
          cat /proc/mounts >> $L 2>&1
          echo "-- rootfs id --" >> $L
          ls / >> $L 2>&1
          cat /etc/openwrt_release >> $L 2>&1
          cat /etc/os-release >> $L 2>&1
          echo "-- dmesg tail --" >> $L
          dmesg | tail -20 >> $L 2>&1
          echo "-- dmesg key --" >> $L
          dmesg | grep -iE 'jffs|mtd|panic|vfs|Unable|error|fail|eth[0-9]|watchdog' | tail -20 >> $L 2>&1
          D=/dev/mtdblock11
          [ -e $D ] || { mkdir -p /tmp/d; mknod /tmp/d/m11 b 31 11 2>/dev/null; D=/tmp/d/m11; }
          if [ -e $D ]; then
            dd if=$L of=$D bs=4096 seek=8192 count=1 conv=notrunc 2>/dev/null && echo "NAND-WRITE OK" >> $L
          else
            echo "NO-MTDBLOCK" >> $L
          fi
          sync
          for d in eth0 eth1 eth2 eth3 lan; do
            [ -e /sys/class/net/$d ] || continue
            ifconfig $d 192.168.1.1 netmask 255.255.255.0 up 2>/dev/null && continue
            ip link set $d up 2>/dev/null
            ip addr add 192.168.1.1/24 dev $d 2>/dev/null
          done
          telnetd -l /bin/sh -p 23 >/dev/null 2>&1 &
          telnetd -l /bin/sh -p 2323 >/dev/null 2>&1 &
          sleep 2
          {
            echo "-- net --"
            ip addr 2>&1 | head -20
            echo "-- netstat --"
            netstat -lnt 2>&1 | head -10
          } >> $L
          [ -e $D ] && dd if=$L of=$D bs=4096 seek=8192 count=1 conv=notrunc 2>/dev/null
          sync
          sleep 1000000
          SH
          sudo chmod 755 rf/init
          sudo rm -f rf/sbin/init
          sudo cp -a rf/init rf/sbin/init
          sudo chmod 755 rf/sbin/init
          ls -l rf/init rf/sbin/init

      - name: Build UART diag init (ARM, no libc, no FP)
        if: ${{ inputs.uart_init == 'true' }}
        run: |
          set -e
          sudo apt-get install -y gcc-arm-linux-gnueabi
          arm-linux-gnueabi-gcc -march=armv7-a -marm -mfloat-abi=soft -O2 \
            -static -nostdlib -ffreestanding -Wl,-e,_start \
            -o uart-init tools/uart-insmod-diag.c
          file uart-init
          arm-linux-gnueabi-readelf -h uart-init | grep -iE 'flags|Type|Entry'
          arm-linux-gnueabi-objdump -d uart-init | grep -ciE 'vldr|vstr|vmov|vadd|fmrx' || true
          sudo rm -f rf/init rf/sbin/init
          sudo cp -a uart-init rf/init
          sudo cp -a uart-init rf/sbin/init
          sudo chmod 755 rf/init rf/sbin/init
          ls -l rf/init rf/sbin/init

      - name: Build netshell (ARM static, no libc)
        run: |
          set -e
          arm-linux-gnueabi-gcc -march=armv7-a -marm -mfloat-abi=soft -O2 \
            -static -nostdlib -ffreestanding -Wl,-e,_start \
            -o netshell tools/netshell.c
          arm-linux-gnueabi-readelf -h netshell | grep -iE 'Entry|Type'
          sudo mkdir -p rf/usr/sbin
          sudo cp netshell rf/usr/sbin/netshell
          sudo chmod 755 rf/usr/sbin/netshell

      - name: Build nandmark (ARM static, soft-float)
        run: |
          set -e
          arm-linux-gnueabi-gcc -march=armv7-a -mfloat-abi=soft -O2 -static \
            -o nandmark tools/nandmark.c
          file nandmark
          arm-linux-gnueabi-readelf -h nandmark | grep -iE 'Flags|Entry'
          sudo mkdir -p rf/usr/sbin
          sudo cp nandmark rf/usr/sbin/nandmark
          sudo chmod 755 rf/usr/sbin/nandmark

      - name: Build JFFS2
        run: |
          set -e
          sudo mkfs.jffs2 -r rf -o openwrt-f673a.jffs2 \
            -e 0x20000 -s 0x800 --no-cleanmarkers -q
          ls -lh openwrt-f673a.jffs2
          md5sum openwrt-f673a.jffs2
          python3 -c "
          import struct
          d=open('openwrt-f673a.jffs2','rb').read()
          print('magic', d[:2].hex(), 'size', len(d))
          "
          sudo tar czf rootfs-patched.tar.gz -C rf .

      - name: Verify JFFS2 contents
        run: |
          pip install --quiet jefferson
          rm -rf jf && python3 - <<'PY'
          import os
          from pathlib import Path
          os.mknod = lambda *a, **k: None
          os.makedev = lambda *a: 0
          from jefferson.jffs2 import extract_jffs2
          d = Path('jf'); d.mkdir(exist_ok=True)
          extract_jffs2(Path('openwrt-f673a.jffs2').resolve(), d, 0)
          for f in ['init', 'sbin/init', 'etc/shadow', 'etc/config/network', 'bin/busybox']:
              p = Path('jf') / f
              print('%-22s %s' % (f, 'OK' if p.exists() else 'MISSING'))
          import struct
          b = Path('jf/bin/busybox').read_bytes()[:40]
          fl = struct.unpack_from('<I', b, 36)[0]
          print('busybox ELF flags %#010x %s' % (fl, 'SOFT-OK' if not fl & 0x400 else 'HARD-FAIL'))
          assert not fl & 0x400, 'hard-float!'
          assert (Path('jf/init').exists() or Path('jf/sbin/init').exists())
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jffs2-sf-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" openwrt-f673a.jffs2 rootfs-patched.tar.gz \
            -R "${GITHUB_REPOSITORY}" \
            --title "F673AV9a soft-float rootfs + JFFS2 ($TAG)" \
            --notes "Patched from ${{ inputs.source_tag }}: br-lan bridges eth0..eth3, static 192.168.1.1/24, root password set, dropbear password auth on. Flash JFFS2 at slot0+0x3C0000 (abs 0x1DC0000)."
          echo "TAG=$TAG"
