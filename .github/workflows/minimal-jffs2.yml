name: minimal-jffs2

on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-form note"
        required: false
        default: "mount test"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabi mtd-utils

      - name: Compile UART init
        run: |
          set -e
          arm-linux-gnueabi-gcc -march=armv7-a -marm -mfloat-abi=soft -O2 \
            -static -nostdlib -ffreestanding -Wl,-e,_start \
            -o uart-init tools/diag-uart-init.c
          file uart-init
          arm-linux-gnueabi-readelf -h uart-init | grep -iE 'Class|Type|Flags|Entry'

      - name: Build minimal rootfs + jffs2
        run: |
          set -e
          rm -rf rfmin && mkdir -p rfmin/sbin rfmin/bin rfmin/dev rfmin/proc rfmin/sys rfmin/tmp rfmin/etc
          cp uart-init rfmin/sbin/init
          cp uart-init rfmin/init
          chmod 755 rfmin/sbin/init rfmin/init
          sudo mknod -m 622 rfmin/dev/console c 5 1
          sudo mknod -m 666 rfmin/dev/null c 1 3
          printf 'NAME=minimal\n' > rfmin/etc/openwrt_release
          sudo mkfs.jffs2 -r rfmin -o minimal.jffs2 -e 0x20000 -s 0x800 --no-cleanmarkers -q
          ls -lh minimal.jffs2
          md5sum minimal.jffs2
          python3 -c "d=open('minimal.jffs2','rb').read(); print('size', len(d), 'magic', d[:2].hex())"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="minimal-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" minimal.jffs2 --title "$TAG" --notes "minimal jffs2 mount test"
          echo "TAG=$TAG" >> $GITHUB_ENV
